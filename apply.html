<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply for a Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            color: #fff;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            color: #fff;
        }

        .form-control,
        .form-select {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            transition: all 0.3s ease-in-out;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(255,255,255,0.25);
        }

        label {
            font-weight: 500;
        }

        .btn-success {
            background: linear-gradient(to right, #00b09b, #96c93d);
            border: none;
            font-weight: 600;
            transition: transform 0.3s ease;
        }

        .btn-success:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #56ab2f, #a8e063);
        }

        input[type="file"]::file-selector-button {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255,255,255,0.3);
        }

        ::placeholder {
            color: #ddd;
        }

        .form-select option {
            color: #000;
            background-color: #fff;
        }

        .form-select {
            color: #000;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Apply for a Job</h2>
        <form action="{{ url_for('submit_application') }}" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Job</label>
                <select name="job" class="form-select" required>
                    {% for job in job_titles %}
                        <option value="{{ job }}">{{ job }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Preferred Job Location</label>
                <input type="text" name="location" class="form-control" placeholder="e.g. Chennai, Remote" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Experience Level</label>
                <select name="experience" class="form-select" required>
                    <option value="Fresher">Fresher</option>
                    <option value="1-2 Years">1-2 Years</option>
                    <option value="3-5 Years">3-5 Years</option>
                    <option value="5+ Years">5+ Years</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Resume (PDF)</label>
                <input type="file" name="resume" accept=".pdf" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Submit Application</button>
        </form>
    </div>
</body>
</html>
