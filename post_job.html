<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post a New Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Background gradient animation */
        body {
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding-top: 50px;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* Glassmorphism card */
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
        }

        .form-label {
            color: #f0f0f0;
            font-weight: 600;
        }

        .custom-input {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            color: white;
        }

        .btn-primary {
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.5);
        }

        .card-header h2 {
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .alert {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} shadow-sm">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card glass shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center">
                <h2 class="mb-0">Post a New Job</h2>
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label">Job Title</label>
                        <input type="text" name="title" class="form-control custom-input" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control custom-input" rows="4" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Requirements</label>
                        <textarea name="requirements" class="form-control custom-input" rows="3"></textarea>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-lg btn-primary px-4">Post Job</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
